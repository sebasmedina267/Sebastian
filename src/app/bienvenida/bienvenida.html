<div class="container">
  <div class="welcome-card">
    <h1>Bienvenido</h1>
    <p class="subtitle">Completa tus datos para continuar</p>

    <form (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" placeholder="Escribe tu nombre" />
      </div>

      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="ejemplo@correo.com" />
      </div>

      <div class="field-group">
        <label for="descripcion">¿Qué te motiva a entrar?</label>
        <textarea id="descripcion" rows="5" placeholder="Escribe una breve descripción..."></textarea>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="message" *ngIf="mensaje">
      <p>{{ mensaje }}</p>
    </div>
  </div>
</div>
